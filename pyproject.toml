[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "upay-copilot"
version = "0.1.0"
description = "AI-powered bilingual financial independence assistant for upay customers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "ISC" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
